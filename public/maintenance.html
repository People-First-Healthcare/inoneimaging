<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maintenance</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 520px;
      width: 100%;
    }
    h1 {
      margin: 0 0 12px;
    }
    p {
      margin: 0;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>We’ll be back soon</h1>
    <p>This website is currently under maintenance.</p>
  </div>
</body>
</html>
